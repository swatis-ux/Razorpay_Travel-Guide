<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" aria-hidden="true"><title></title><defs>
  <filter id="pig" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
