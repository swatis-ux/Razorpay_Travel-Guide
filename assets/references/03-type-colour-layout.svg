<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<title>Type colour layout</title><desc>Typography palette and layout reference</desc>
<defs>
 <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
  <circle cx="12" cy="18" r="0.8" fill="#8C826F" opacity=".13"/>
  <circle cx="73" cy="42" r="0.65" fill="#8C826F" opacity=".12"/>
  <circle cx="38" cy="94" r="0.7" fill="#8C826F" opacity=".10"/>
  <path d="M92 12l3 1M20 65l4 -1M104 83l3 1" stroke="#8C826F" stroke-width=".6" opacity=".10"/>
 </pattern>
 <style>
  .display{font-family:'Fraunces','Georgia',serif;font-weight:500;letter-spacing:-1.6px}
  .body{font-family:'Epilogue','Arial',sans-serif}
  .eyebrow{font-family:'Epilogue','Arial',sans-serif;font-size:13px;letter-spacing:2px;font-weight:600}
  .ink{fill:#292821}.muted{fill:#777468}
  .stroke{stroke:#292821;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .fine{stroke:#292821;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .panel{fill:#FFFDF8;stroke:#D9D2C4;stroke-width:1}
 </style>
</defs>
<rect width="100%" height="100%" fill="#F7F3EA"/>
<rect width="100%" height="100%" fill="url(#grain)"/>

<text x="72" y="76" class="eyebrow" fill="#465C48">DESIGN TOKENS / 03</text>
<text x="72" y="145" class="display ink" font-size="60">Type, colour & composition</text>
<rect x="72" y="210" width="620" height="590" class="panel"/>
<text x="108" y="270" class="eyebrow" fill="#465C48">DISPLAY / FRAUNCES</text>
<text x="108" y="365" class="display ink" font-size="76">Go a little</text>
<text x="108" y="448" class="display ink" font-size="76" font-style="italic">further.</text>
<text x="108" y="510" class="body ink" font-size="18">BODY / EPILOGUE</text>
<text x="108" y="548" class="body muted" font-size="16">A clear, calm interface for planning a trip</text>
<text x="108" y="574" class="body muted" font-size="16">with considered recommendations and room</text>
<text x="108" y="600" class="body muted" font-size="16">to make it your own.</text>
<text x="108" y="680" class="eyebrow" fill="#465C48">SPACING & RHYTHM</text>
<text x="108" y="714" class="body muted" font-size="14">Wide margins · 8 px base spacing · quiet dividers</text>
<text x="108" y="746" class="body muted" font-size="14">Avoid dense card grids and excessive pill controls</text>
<text x="760" y="245" class="eyebrow" fill="#465C48">PALETTE</text>
<rect x="760" y="285" width="250" height="68" fill="#F7F3EA" stroke="#D9D2C4"/><text x="760" y="377" class="body ink" font-size="14">Paper</text><text x="1010" y="377" text-anchor="end" class="body muted" font-size="12">#F7F3EA</text><rect x="1050" y="285" width="250" height="68" fill="#292821" stroke="#D9D2C4"/><text x="1050" y="377" class="body ink" font-size="14">Ink</text><text x="1300" y="377" text-anchor="end" class="body muted" font-size="12">#292821</text><rect x="760" y="397" width="250" height="68" fill="#9BAE91" stroke="#D9D2C4"/><text x="760" y="489" class="body ink" font-size="14">Sage</text><text x="1010" y="489" text-anchor="end" class="body muted" font-size="12">#9BAE91</text><rect x="1050" y="397" width="250" height="68" fill="#465C48" stroke="#D9D2C4"/><text x="1050" y="489" class="body ink" font-size="14">Forest</text><text x="1300" y="489" text-anchor="end" class="body muted" font-size="12">#465C48</text><rect x="760" y="509" width="250" height="68" fill="#C87555" stroke="#D9D2C4"/><text x="760" y="601" class="body ink" font-size="14">Terracotta</text><text x="1010" y="601" text-anchor="end" class="body muted" font-size="12">#C87555</text><rect x="1050" y="509" width="250" height="68" fill="#D9B75D" stroke="#D9D2C4"/><text x="1050" y="601" class="body ink" font-size="14">Mustard</text><text x="1300" y="601" text-anchor="end" class="body muted" font-size="12">#D9B75D</text><rect x="760" y="621" width="250" height="68" fill="#A8C2C5" stroke="#D9D2C4"/><text x="760" y="713" class="body ink" font-size="14">Blue</text><text x="1010" y="713" text-anchor="end" class="body muted" font-size="12">#A8C2C5</text><rect x="1050" y="621" width="250" height="68" fill="#D8A49A" stroke="#D9D2C4"/><text x="1050" y="713" class="body ink" font-size="14">Rose</text><text x="1300" y="713" text-anchor="end" class="body muted" font-size="12">#D8A49A</text>
<text x="760" y="790" class="eyebrow" fill="#465C48">LAYOUT PRINCIPLE</text>
<text x="760" y="830" class="body ink" font-size="15">One strong editorial moment per section.</text>
<text x="760" y="858" class="body muted" font-size="14">Balance illustration with readable product UI.</text>

</svg>